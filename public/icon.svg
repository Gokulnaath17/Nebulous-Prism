<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a0a0a5" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="facet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#707075" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#303035" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="facet3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0d0d5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#505055" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Prism Gem Graphic -->
  <g filter="url(#glow)">
    <!-- Top left facet -->
    <polygon points="256,96 144,208 256,256" fill="url(#facet1)" />
    <!-- Top right facet -->
    <polygon points="256,96 256,256 368,208" fill="url(#facet3)" />
    <!-- Outer left top -->
    <polygon points="144,208 112,256 256,256" fill="url(#facet2)" opacity="0.85" />
    <!-- Outer right top -->
    <polygon points="368,208 256,256 400,256" fill="url(#facet1)" opacity="0.75" />
    <!-- Lower center left facet -->
    <polygon points="256,256 112,256 256,416" fill="url(#facet2)" />
    <!-- Lower center right facet -->
    <polygon points="256,256 256,416 400,256" fill="url(#facet1)" />
  </g>
</svg>

